name: gates
on: [push, pull_request]

# ONE PLATFORM ON PURPOSE — portable Common Lisp, no FFI, no platform calls.  The
# repos that genuinely differ per platform say so in their own workflows.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seal
          submodules: recursive

      # seal is one repo in a workspace of them, and the suite looks for siblings
      # beside it.  The list is the TRANSITIVE set — when it goes stale the failure is
      # "Component X not found", which reads like a broken build rather than a missing
      # line here.
      - name: Sibling checkouts
        run: |
          for repo in natrium; do
            git clone --depth 1 -q https://github.com/modus-lisp/$repo.git "$repo"
          done

      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl
      - name: Tests
        working-directory: seal
        # The registry root has to be ABSOLUTE — ASDF rejects (:tree #p"../") with
        # "Expected an absolute pathname" — and github.workspace is the directory that
        # holds both this checkout and its siblings.
        env:
          CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}/") (:exclude "vendor") (:exclude "deps") :inherit-configuration)'
        run: sbcl --non-interactive --eval '(require :asdf)' --eval '(asdf:test-system "seal")'
